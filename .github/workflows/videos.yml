name: videos
on:
  schedule:
    # Günde 4 Shorts. Slotlar UTC 05:00, 10:00, 16:00, 19:00 = TR 08:00, 13:00, 19:00, 22:00.
    # GitHub cron'u geciktirip düşürebildiği için saatlik tetiklenir; slot_guard.py yalnızca
    # zamanı gelmiş ve henüz yüklenmemiş slot varsa video üretir (kaçan slot bir sonraki saatte telafi edilir).
    - cron: "17 5-21 * * *"
  workflow_dispatch:
    inputs:
      format:
        description: Format (boş = slot sırası)
        type: choice
        options: ["", sahne, kelime, quiz, av]
        default: ""
      no_upload:
        description: Sadece render (yükleme yok)
        type: boolean
        default: false
      bank:
        description: bank/ skeç dosyası (örn. bank/001_kafe_will_moechte.json)
        type: string
        default: ""
      auto:
        description: Harici zamanlayıcı çağrısı (cron-job.org) - slot planına uy
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: repo-writes
  cancel-in-progress: false

jobs:
  guard:
    if: github.event_name == 'schedule' || inputs.auto
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - uses: actions/checkout@v5
      - id: g
        env:
          LOG_FILE: published.csv
          SLOTS: "05:00,10:00,16:00,19:00"
          HAS_YT: ${{ secrets.YT_REFRESH_TOKEN != '' }}
        run: |
          if [ "$HAS_YT" != "true" ]; then echo "YouTube bağlı değil (auth_setup.py), atlanıyor"; echo "go=0" >> $GITHUB_OUTPUT; exit 0; fi
          python3 .github/slot_guard.py

  make:
    needs: guard
    if: always() && ((github.event_name != 'schedule' && !inputs.auto) || needs.guard.outputs.go == '1')
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: System packages (ffmpeg, emoji font)
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-color-emoji
      - name: Python packages (CPU torch + Chatterbox)
        run: |
          pip install torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Model cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/fenek
          key: models-chatterbox-mtl-v1-${{ hashFiles('fenek/voice.py', 'voices/**') }}
          restore-keys: models-chatterbox-mtl-v1-
      - name: Run pipeline
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_CHANNEL_ID: ${{ secrets.YT_CHANNEL_ID }}
          YT_PRIVACY: ${{ vars.YT_PRIVACY }}
          MAX_PER_DAY: ${{ vars.MAX_PER_DAY }}
          LEVELS: ${{ vars.LEVELS }}
          SITE_URL: ${{ vars.SITE_URL }}
          TTS_ENGINE: ${{ vars.TTS_ENGINE }}
        run: python run.py ${{ inputs.format && format('--format {0}', inputs.format) || '' }} ${{ inputs.bank && format('--bank {0}', inputs.bank) || '' }} ${{ inputs.no_upload && '--no-upload' || '' }}
      - name: Keep video for review
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: video-${{ github.run_id }}
          path: |
            output/*/video.mp4
            output/*/meta.json
            output/*/thumb.png
          retention-days: 7
          if-no-files-found: ignore
      - name: Commit log
        if: always()
        run: |
          git config user.name "fenek-bot"
          git config user.email "bot@users.noreply.github.com"
          for p in history.json published.csv queue; do [ -e "$p" ] && git add "$p" || true; done
          git diff --cached --quiet && exit 0
          git commit -m "video: $(date -u +%F-%H%M)"
          git pull --rebase
          git push
