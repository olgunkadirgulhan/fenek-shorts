name: telegram-relay
# Bloop Bonkers, Moon or Doom ve Why Stocks Moved'un günün videosu (artifact 'social-*') → Fenek botuyla Telegram
on:
  schedule:
    - cron: "0 * * * *"  # gönderim 15:00 UTC (TR 18:00); cron-job.org da her saat başı tetikler
  workflow_dispatch:
    inputs:
      force:
        description: Saat ve diğer kanalı bekleme, hazır olanı hemen gönder
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

# Kendi kuyruğu: video iş akışıyla aynı grupta olunca bekleyen relay iptal ediliyordu (günde ~3 çalışma).
# Saatlik tetik cron-job.org'dan gelir; GitHub cron'u yedek.
concurrency:
  group: telegram-relay
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Gönder
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELAY_REPOS: olgunkadirgulhan/bloop-bonkers,olgunkadirgulhan/konusan-meyveler,olgunkadirgulhan/moon-or-doom,olgunkadirgulhan/why-stocks-moved
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RELAY_FORCE: ${{ inputs.force && '1' || '' }}
        run: python tools/telegram_relay.py
      - name: Kaydet (tekrar gönderilmesin)
        if: always()
        run: |
          git config user.name "fenek-bot"
          git config user.email "bot@users.noreply.github.com"
          [ -e telegram_relay.json ] && git add telegram_relay.json || true
          git diff --cached --quiet && exit 0
          git commit -m "telegram relay: $(date -u +%F-%H%M)"
          git pull --rebase
          git push
