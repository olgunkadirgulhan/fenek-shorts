name: tts-probe
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: |
          pip install torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/fenek
          key: models-chatterbox-mtl-v1-${{ hashFiles('fenek/voice.py', 'voices/**') }}
          restore-keys: models-chatterbox-mtl-
      - run: python tools/tts_probe.py
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: probe-${{ github.run_id }}
          path: probe/
          retention-days: 3
